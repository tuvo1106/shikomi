# Git hooks. Install once with: lefthook install

commit-msg:
  commands:
    conventional-commit:
      run: |
        set -e
        msg=$(head -1 "{1}")
        case "$msg" in
          Merge*|Revert*|fixup!*|squash!*) exit 0 ;;
        esac
        pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,}'
        if ! printf '%s' "$msg" | grep -qE "$pattern"; then
          echo "✗ Commit message must follow Conventional Commits (see CONTRIBUTING.md)."
          echo "  got:      $msg"
          echo "  expected: feat(problems): paginate the catalog"
          echo "  types:    feat fix docs refactor perf test build ci chore revert"
          exit 1
        fi
        if [ ${#msg} -gt 72 ]; then
          echo "✗ Subject line is ${#msg} chars; keep it under 72."
          exit 1
        fi

pre-commit:
  parallel: true
  commands:
    ruff:
      glob: "*.py"
      run: |
        set -e
        uv run --project backend ruff check --fix {staged_files}
      stage_fixed: true

    # Treat this repo as public: no secrets committed, ever — not "temporarily",
    # not in a branch you plan to squash.
    no-secrets:
      run: |
        if git diff --cached --name-only | grep -qE '(^|/)(\.env(\..*)?$|.*\.key$|.*\.pem$|credentials/.*)'; then
          echo "✗ Refusing to commit a secret file. Use environment variables instead."
          exit 1
        fi

# Run the parts of CI your diff touches before the push leaves your machine, so a broken
# push doesn't spend Actions minutes finding out. Mirrors ci.yml (scripts/ci-local.sh);
# the slow jobs (sandbox, e2e, playwright) stay in CI or `scripts/ci-local.sh full`.
# Skip once with `git push --no-verify` (or LEFTHOOK=0).
pre-push:
  commands:
    ci-local:
      run: scripts/ci-local.sh --changed
