{{- if .Values.worker.enabled }}
# The judge worker. Under k8s it does NOT shell docker-outside-of-docker (no host
# socket) — it calls the Kubernetes API to launch one locked-down Pod per
# submission (worker/k8s_runner.py). That needs a ServiceAccount with RBAC to
# manage judge pods + their payload ConfigMaps (rbac.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  # When KEDA is enabled it owns the replica count (via the ScaledObject's HPA);
  # setting replicas here too would make Helm and KEDA fight on every upgrade.
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      serviceAccountName: shikomi-worker
      containers:
        - name: worker
          image: {{ .Values.images.worker }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["arq", "worker.main.WorkerSettings"]
          envFrom:
            - configMapRef: { name: shikomi-config }
            - secretRef: { name: shikomi-secret }
          env:
            - { name: JUDGE_RUNNER, value: "k8s" }
            # Create judge pods in this release's namespace.
            - name: JUDGE_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
{{- end }}
