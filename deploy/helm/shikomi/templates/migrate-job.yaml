# Schema migration + seed, run as a Helm hook on every install/upgrade — the K8s
# equivalent of compose's one-shot `migrate` service.
#
# post-install, because on a first install the in-cluster Postgres doesn't exist
# until the chart's resources are applied (the api's readiness doesn't need the
# schema, so `helm --wait` can't deadlock on it). pre-upgrade, so on an upgrade the
# schema is migrated *before* the new api/worker pods start: as a post-upgrade hook
# it ran after them, and the new code met the old schema (every problem read failed
# until the hook finished). Old pods still serve while it runs, so a migration must
# keep the previous release working, or its release notes must say to scale api and
# worker down first (AGENTS.md). A pre-upgrade hook runs with the release's
# previous ConfigMap/Secret, which it only needs for the database URL.
#
# An initContainer waits for Postgres to accept connections before Alembic runs.
#
# before-hook-creation delete policy lets the immutable Job be recreated on each
# `helm upgrade` (Jobs can't be patched in place).
apiVersion: batch/v1
kind: Job
metadata:
  name: shikomi-migrate
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { app: shikomi-migrate }
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h postgres -U {{ .Values.postgres.user }}; do echo waiting for postgres; sleep 2; done"]
        # The problems ship as their own image (scripts/k8s-up.sh builds it from
        # PROBLEMS_DIR; an operator pushes theirs to a registry), and this copies them
        # into the emptyDir app.cli seed reads. An image has no size cap, unlike the
        # 1MiB ConfigMap this replaced, and it versions the problem set like any
        # other deployable.
        - name: copy-problems
          image: {{ .Values.images.seed }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["sh", "-c", "cp /problems/*.json /seed/problems/"]
          volumeMounts:
            - { name: seed, mountPath: /seed/problems }
      containers:
        - name: migrate
          image: {{ .Values.images.api }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]
          envFrom:
            - configMapRef: { name: shikomi-config }
            - secretRef: { name: shikomi-secret }
          volumeMounts:
            # app.cli seed reads /seed/problems, filled by the copy-problems init container.
            - { name: seed, mountPath: /seed/problems }
      volumes:
        - name: seed
          emptyDir: {}
