# Caddy serving the built SPA + proxying /api/* to the api Service. Same image as
# the compose stack; SITE_ADDRESS=:80 keeps it plain-HTTP inside the cluster
# (TLS, when wanted, is terminated at the Ingress).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: {{ .Values.images.web }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - { name: SITE_ADDRESS, value: ":80" }
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports:
    - { port: 80, targetPort: 80 }
