[project]
name = "shikomi-backend"
version = "0.1.0"
description = "Shikomi API and judge worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "arq>=0.26",
    "redis>=5.2",
    "kubernetes>=36.0.3",
    "httpx>=0.28",
    "cryptography>=50.0.1",
    "ozy",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

# The ozymandias SDK is vendored as a wheel rather than installed from a registry: the
# Docker build context is ./backend, so nothing outside it is visible to the build, and
# CI has no access to the sibling repo. Refresh it with `make sdk-release` over there.
[tool.uv.sources]
ozy = { path = "vendor/ozy-0.1.0-py3-none-any.whl" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["docker: needs a running Docker daemon + the judge image; run with -m docker"]
# Default run excludes real-container tests; run those explicitly with -m docker.
addopts = "-ra -m 'not docker' --cov=app --cov=worker --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
# SQLAlchemy async runs coroutine bodies inside greenlets; without this, coverage
# under-counts every async service function.
concurrency = ["greenlet", "thread"]
omit = ["tests/*", "alembic/*"]
